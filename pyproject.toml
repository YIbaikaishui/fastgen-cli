[project]
name = "fastgen-cli"
version = "0.4.1"
description = "FastAPI feature-based module manager (nest-cli style for FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "一白开水" }]
keywords = ["fastapi", "code-generator", "scaffold", "cli", "nest-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/YIbaikaishui/fastgen-cli"
Repository = "https://github.com/YIbaikaishui/fastgen-cli"
Issues = "https://github.com/YIbaikaishui/fastgen-cli/issues"

[project.scripts]
fastgen = "fastgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastgen"]

[tool.ruff]
line-length = 100
target-version = "py311"
