[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fastgen-cli"
version = "0.7.0" # keep in sync with Cargo.toml
description = "FastAPI feature-based module manager (nest-cli style for FastAPI), written in Rust"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "一白开水" }]
keywords = ["fastapi", "code-generator", "scaffold", "cli", "nest-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/YIbaikaishui/fastgen-cli"
Repository = "https://github.com/YIbaikaishui/fastgen-cli"
Issues = "https://github.com/YIbaikaishui/fastgen-cli/issues"

# The Rust binary is shipped inside the wheel and installed onto PATH as
# `fastgen` — the uv model: a Rust tool distributed via pip.
[tool.maturin]
bindings = "bin"
